name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test (race, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race with coverage
        shell: bash # explicit shell so the pipe below fails the step when tests fail
        run: go test -race -count=1 -cover ./... | tee test.out
      - name: Enforce 80% coverage on every internal package
        run: |
          awk '/ember\/internal\// {
            match($0, /coverage: [0-9.]+%/)
            pct = substr($0, RSTART + 10, RLENGTH - 11)
            print $2 ": " pct "%"
            if (pct + 0 < 80) { print "::error::" $2 " coverage " pct "% is below 80%"; bad = 1 }
          } END { exit bad }' test.out

  portability:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -count=1 ./...

  fuzz:
    name: Fuzz (30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: FuzzParse
        run: go test ./internal/resp -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ember:ci .
      - name: Image facts
        run: |
          docker image inspect ember:ci --format 'size: {{.Size}} bytes, user: {{.Config.User}}'
          test "$(docker image inspect ember:ci --format '{{.Config.User}}')" = "65532:65532"
      - name: Smoke test with redis-cli
        run: |
          docker run -d --name ember -p 6380:6380 ember:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' ember)" = healthy ] && break
            sleep 1
          done
          docker inspect --format 'health: {{.State.Health.Status}}' ember
          cli="docker run --rm --network host redis:7-alpine redis-cli -p 6380"
          test "$($cli ping)" = PONG
          $cli set smoke ok
          test "$($cli get smoke)" = ok
          $cli info server | grep -E 'tcp_port|ember_version'
      - name: Compare replies with real Redis 7
        run: |
          docker network create compat
          docker run -d --name compat-redis --network compat redis:7-alpine redis-server --save ''
          docker run -d --name compat-ember --network compat ember:ci
          sleep 3
          docker run --rm --network compat -v "$PWD/test/cli:/cli:ro" redis:7-alpine \
            sh /cli/compat.sh compat-redis 6379 compat-ember 6380
      - name: Container logs
        if: failure()
        run: docker logs ember
